name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPAMYES: "1"
  # Qt is found by config/discover.ml. Nothing here sets QTDIR on Linux,
  # deliberately: that exercises the pkg-config fallback against a Qt layout
  # (/usr/include/<triple>/qt6/QtWidgets) that the prefix scanner does not
  # recognise, which is exactly the Debian/Ubuntu case we want covered.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ubuntu / ocaml 5.0", os: ubuntu-latest, ocaml: "5.0", qt: apt }
          - { name: "ubuntu / ocaml 5.1", os: ubuntu-latest, ocaml: "5.1", qt: apt }
          - { name: "ubuntu / ocaml 5.2", os: ubuntu-latest, ocaml: "5.2", qt: apt }
          - { name: "ubuntu / ocaml 5.3", os: ubuntu-latest, ocaml: "5.3", qt: apt }
          - { name: "macos / ocaml 5.2", os: macos-latest, ocaml: "5.2", qt: brew }
          - { name: "macos / ocaml 5.3", os: macos-latest, ocaml: "5.3", qt: brew }

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: matrix.qt == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools pkg-config build-essential

      - name: Install Qt (macOS)
        if: matrix.qt == 'brew'
        run: |
          brew install qt@6 pkg-config
          # qt@6 is keg-only, so its .pc files are not on pkg-config's default
          # path. Without this, config/discover.ml's pkg-config fallback fails
          # and the job dies looking for Qt headers.
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@6)/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Set up opam
        uses: ocaml/setup-ocaml@v3
        with:
          # A semver range: the action resolves it to the newest release in the
          # range, so "5.0" tracks 5.0.x without a hardcoded patch level.
          ocaml-compiler: ${{ matrix.ocaml }}
          # GitHub runners are containers without bubblewrap; opam's sandbox
          # fails there, so use a bubblewrap-free switch.
          opam-disable-sandboxing: true
          # The action pins the local package as camlqt6.dev by default. The
          # build step then runs `opam install . --deps-only`, and the two
          # collide: "Package conflict!", exit code 20. Installing the local
          # package explicitly is what we want, so the pin is redundant.
          opam-pin: false

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
            ~/.cache/opam
          key: ${{ runner.os }}-opam-${{ matrix.ocaml }}-${{ hashFiles('camlqt6.opam') }}

      - name: Build and test
        # opam exec -- deliberately, not bare dune. setup-ocaml creates a local
        # switch in _opam/, whose bin/ is not on PATH, so a bare `dune build`
        # fails with "dune: command not found" (exit 127) even though dune is
        # installed. opam exec resolves the same switch the install used.
        run: |
          opam install -y . --deps-only
          opam exec -- dune build @install
          opam exec -- dune runtest

  build-windows:
    name: windows / ocaml 5.3
    runs-on: windows-latest
    # MSYS2 and pacman are deliberately not used. MSYS2 packages Qt 6
    # (mingw-w64-ucrt-x86_64-qt6-base) but does not package opam at all, in
    # either the mingw-w64 or the msys repository, so there is no way to get a
    # matching OCaml from it.
    #
    # Instead setup-ocaml provisions a Cygwin-based opam with a MinGW-w64
    # OCaml compiler, and Qt comes from its official win64_mingw package via
    # aqtinstall. Both target x86_64-w64-mingw32, so the import libraries and
    # the OCaml runtime agree on ABI. This is the same pairing the sibling
    # bluddy/rails release workflow uses for SDL2.
    steps:
      - uses: actions/checkout@v4

      - name: Set up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          opam-disable-sandboxing: true
          opam-pin: false

      - name: Install Qt (win64_mingw)
        shell: bash
        run: |
          python -m pip install --upgrade aqtinstall
          python -m aqt install-qt windows desktop 6.8.0 win64_mingw \
            -O "$GITHUB_WORKSPACE/Qt"
          # aqt lays this out as <outdir>/<version>/<arch>; this is the prefix
          # QTDIR wants, since it holds include/QtWidgets/qwidget.h and lib/.
          qt="$GITHUB_WORKSPACE/Qt/6.8.0/mingw_64"
          test -f "$qt/include/QtWidgets/qwidget.h" || {
            echo "::error::Qt headers not where QTDIR expects them"; exit 1; }
          echo "QTDIR=$qt" >> "$GITHUB_ENV"
          # Qt6Core.dll and friends must be loadable by the test binary.
          echo "$qt/bin" >> "$GITHUB_PATH"

      - name: Build and test
        shell: bash
        run: |
          opam install -y . --deps-only
          opam exec -- dune build @install
          opam exec -- dune runtest

  metadata:
    name: opam metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          opam-disable-sandboxing: true
          opam-pin: false
      - run: opam lint camlqt6.opam
      # opam lint does not check that dependencies resolve, so it happily passes
      # a package naming a dependency that does not exist in opam-repository.
      # That is how "pkg-config" shipped when the correct name is
      # conf-pkg-config; opam install then failed for everyone with
      # "Missing dependency ... unknown package". A dry run solves without
      # touching the switch.
      - name: Dependencies must be solvable
        run: opam install . --deps-only --dry-run
      # Guards the hand-edited discovery script, which nothing else exercises.
      # config/discover.ml is run by dune-configurator on every build, so a
      # warning there would otherwise only be seen as console noise.
      - name: Configure must not warn
        run: |
          output=$(opam exec -- dune build @all 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -q 'camlqt6-discover] warning'; then
            echo "::error::config/discover.ml emitted a discovery warning"
            exit 1
          fi

  warnings:
    name: strict warnings (advisory)
    runs-on: ubuntu-latest
    # The root dune file deliberately leaves -warn-error off. The dune-workspace
    # defines a `warnings` profile that turns it on, so new warnings surface
    # without getting in the way of a normal `dune build`.
    #
    # Verified green on 5.3/Windows. Left advisory until it has passed on a
    # Linux runner, since the warning set can differ slightly across platforms
    # and compiler versions. To gate on it, drop the line below.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools pkg-config build-essential
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          opam-disable-sandboxing: true
          opam-pin: false
      - run: opam install -y . --deps-only
      # Note: dune 3 removed `--flags`, and `(profile ...)` cannot carry flags
      # either, so the flags come from the `warnings` env stanza in
      # dune-workspace. `dune build -- <flags>` does not work: dune reads those
      # as build targets.
      - run: opam exec -- dune build @all --profile warnings